# konfiguracja projektu

[project]
site_name = "Distrust"
site_description = "Nie ufaj domyślnie. Ale najpierw wiedz, czemu."
site_author = "Eteryu"
site_url = "https://distrust.pl"
copyright = 'Copyright &copy; 2026 Eteryu · Manifest o świadomym zaufaniu<br>Treść na licencji <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a><br><a href="mailto:kontakt@distrust.pl">kontakt@distrust.pl</a>'

# niestandardowe style
extra_css = ["assets/css/extra.css"]

# nawigacja
nav = [
    { "Manifest" = "index.md" },
    { "Zasady" = [
        { "Domyślne ustawienia" = "zasady/domyslne-ustawienia.md" },
        { "Ufaj świadomie" = "zasady/ufaj-swiadomie.md" },
        { "Zaufanie ma termin ważności" = "zasady/zaufanie-ma-termin-waznosci.md" },
    ]},
    { "O projekcie" = "o-projekcie.md" },
]

# motyw
[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "pl"
font = false
logo = "assets/images/logo.png"
favicon = "assets/images/favicon.png"

# funkcje interfejsu
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# paleta kolorów (tryb ciemny/jasny)
[[project.theme.palette]]
primary = "indigo"
accent = "indigo"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
primary = "indigo"
accent = "indigo"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# ustawienia dodatkowe
[project.extra]
generator = false

# linki społecznościowe w stopce
[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://infosec.exchange/@eteryu"
name = "Mastodon"

[[project.extra.social]]
icon = "fontawesome/solid/link"
link = "https://eteryu.space"
name = "Eteryu.space"

# rozszerzenia markdown
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
