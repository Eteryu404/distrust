{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  {%- set og_title = page.title or config.site_name -%}
  {%- if page.meta and page.meta.description -%}
    {%- set og_desc = page.meta.description -%}
  {%- else -%}
    {%- set og_desc = config.site_description -%}
  {%- endif -%}

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_desc }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="https://distrust.pl/assets/images/og.png">
  <meta property="og:locale" content="pl_PL">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ og_desc }}">
  <meta name="twitter:image" content="https://distrust.pl/assets/images/og.png">
{% endblock %}
